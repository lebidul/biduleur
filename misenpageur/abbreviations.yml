# =============================================================================
# ABRÉVIATIONS - Configuration pour réduire le texte
# =============================================================================
# Placement : misenpageur/abbreviations.yml
#
# Le remplacement préserve la casse d'origine :
#   "SAINTE" → "STE", "Sainte" → "Ste", "sainte" → "ste"
#   "Centre Culturel" → "CC", "centre culturel" → "cc"
#
# Structure :
#   clé:
#     original: "texte à remplacer"
#     replacement: "texte de remplacement"
#     description: "Description pour l'interface"
#     enabled: true/false (activé par défaut)
# =============================================================================

# --- Préfixes honorifiques ---

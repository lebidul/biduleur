# ======================================================================
# 📝 NOTES D'UTILISATION
# ======================================================================
#
# 1. GÉNÉRATION STANDARD (impression bureau)
#    python -m misenpageur.main --config misenpageur/config.print.yml
#
# 2. GÉNÉRATION PDF/X (impression pro)
#    - Installer Ghostscript : https://ghostscript.com/releases/gsdnld.html
#    - Changer : pdfx: false → pdfx: true
#    - Relancer la génération
#
# 3. VÉRIFICATION DE LA QUALITÉ
#    pdffonts bidul_print.pdf    # Polices embarquées ?
#    pdfinfo bidul_print.pdf     # Infos générales
#
# 4. CROP MARKS
#    Les traits de coupe sont visibles aux 4 coins du PDF.
#    Ils guident l'imprimeur pour couper précisément.
#
# 5. BLEED (Fond perdu)
#    3mm de débordement sont ajoutés pour éviter les bords blancs
#    si la découpe n'est pas parfaitement alignée.
#
# ======================================================================
# =========================
# Configuration optimisée pour IMPRESSION PROFESSIONNELLE
# =========================
#
# Usage : python -m misenpageur.main --config misenpageur/config.print.yml
#
# Note: Les abréviations sont dans un fichier séparé : abbreviations.yml

month_label: "2025-11"

debug_mode: false

# Chemins relatifs à la racine du projet
input_html: "misenpageur/fichier_biduleur/biduleur_bullets.html"
template_pdf: "misenpageur/templates/bidul_template.pdf"
output_pdf: "misenpageur/bidul/bidul_print.pdf"

logos_dir: "misenpageur/assets/logos.svg"
logos_layout: "svg"
logos_svg_file: "misenpageur/assets/logos.svg"
logos_print_svg_file: "misenpageur/assets/logos.impression.svg"
cover_image: "misenpageur/assets/couv/couverture.png"
nobr_file: "misenpageur/assets/textes/nobr.txt"
ours_md: "misenpageur/assets/ours/ours.md"
ours_svg: "misenpageur/assets/ours/ours_template.svg"
ours_svg_file: "misenpageur/assets/ours/ours.svg"

# ======================  ===
# Paramètres typographiques
# =========================

font_name: "Arial Narrow"
font_size_min: 5
font_size_max: 30.0
font_size_mode: auto
font_size_forced: 7.9
leading_ratio: 1.12

# =========================
# Marges internes
# =========================

inner_padding: 2

# =========================
# Répartition du texte HTML
# =========================

text_sections_order:
  - "S5"
  - "S6"
  - "S3"
  - "S4"

# Police des dates (null = identique au corps)
date_font_name: null

# Espacement (pt)
date_spaceBefore: 4
date_spaceAfter: 4
event_spaceBefore: 1
event_spaceAfter: 1
event_spaceAfter_perLine: 0.4
min_event_spaceAfter: 1
first_non_event_spaceBefore_in_S5: 0

# Césure utile
split_min_gain_ratio: 0.10

# Bullets / hanging indent
show_event_bullet: true
event_bullet_replacement: null
bullet_text_indent: 0
bullet_size_ratio: 0.9
event_hanging_indent: 10

# Date box (bloc)
date_box:
  enabled: false
  padding: 3
  border_width: 0
  border_color: "#000000"
  back_color: "#f2f2f2"

# Configuration de la ligne horizontale pour les dates
date_line:
  enabled: true
  width: 1.5
  color: "#000000"
  gap_after_text_mm: 3.0

auteur_couv: ""
auteur_couv_url: ""

# ======================================================================
# CONFIGURATION IMPRESSION PROFESSIONNELLE
# ======================================================================

prepress:
  convert_images: false
  jpeg_quality: 95
  min_effective_dpi: 300
  max_effective_dpi: 450
  cmyk_profile: ""
  add_crop_marks: true
  bleed_mm: 3
  pdfx: true
  ghostscript_path: "gswin64c"
  pdfx_icc: ""

# ======================================================================

s1_split:
  logos_ratio: 0.5
  gutter: 6

pdf_layout:
  page_margin_mm: 1
  section_spacing_mm: 1

section_1:
  ours_font_name: "Arial"
  ours_font_size: 7.0
  ours_line_spacing: 1.3
  ours_background_png: "misenpageur/assets/ours/ours_template.png"
  qr_code_title: "Agenda culturel"
  qr_code_title_font_name: "Arial-Bold"
  qr_code_title_font_size: 9
  auteur_pos_x_mm: 25
  auteur_pos_y_mm: 47
  auteur_font_name: "Arial-Bold"
  auteur_font_size: 9
  auteur_align: "center"
  qr_code_value: "https://www.lebidul.com"
  qr_code_height_mm: 32
  qr_code_style: "gapped"
  qr_code_color: "#000000"
  additional_box_height_mm: 35
  logo_box_bottom_margin_mm: 0
  ours_hyperlinks:
    - href: "https://www.facebook.com/LeBidul"
      rect_mm: [6, 87, 12, 5]
    - href: "https://www.instagram.com/le_bidul_72"
      rect_mm: [30, 87, 16, 5]
    - href: "https://radioalpa.com/emissions/le-biduloscope/"
      rect_mm: [30, 81, 16, 5]
    - href: "http://www.lebidul.com"
      rect_mm: [ 6, 81, 16, 5 ]


cucaracha_box:
  content_type: "text"
  content_value: ""
  title: "Cucaracha"
  title_font_name: "Arial-BoldItalic"
  title_font_size: 8
  text_font_name: "Helvetica"
  text_font_size: 8
  text_style: "italic"
  text_align: "center"
  height_mm: 28

skip_cover: false

poster:
  enabled: true
  design: 0
  background_image_alpha: 0.75
  title: "le bidul - octobre 2025"
  font_name_title: "DSNetStamped"
  title_logo_path: "misenpageur/assets/icons/logo-les-arts-services.png"
  title_back_color: "#7F7F7F"
  font_size_title: 34.0
  font_size_min: 6.0
  font_size_max: 10.0
  font_size_safety_factor: 1.0
  date_spaceBefore: 3
  date_spaceAfter: 3
  text_color_auto: true
  text_color_dark_bg: "#FFFFFF"
  text_color_light_bg: "#000000"
  brightness_threshold: 120

packing_strategy:
  algorithm: 'Global'
  sort_algo: 'WIDTH'

logo_hyperlinks:
- image: "BlueZinc.png"
  href: "https://www.facebook.com/bluezincbar/?locale=fr_FR"
- image: "BrasserieSeptante-Deux.png"
  href: "https://www.brasserieseptantedeux.com/"
- image: "Bulle.png"
  href: "https://www.librairie-bulle.fr/"
- image: "LaCaveDePedro.png"
  href: "https://www.cavedepedro.com/"
- image: "LaPiraterie.png"
  href: "https://www.lacorderaide.com/"
- image: "LeBarouf.png"
  href: "https://www.facebook.com/barouf.lemans/"
- image: "LeLezard.png"
  href: "https://www.facebook.com/p/le-lezard-bar-100055389711041/"
- image: "LeLocalABieres.png"
  href: "https://www.le-local-a-bieres.fr/"
- image: "LeMansLaVille.png"
  href: "https://www.lemans.fr/"
- image: "LePilierRouge.png"
  href: "https://www.facebook.com/p/Bar-Tabac-Le-Pilier-Rouge-100078241743190/"
- image: "RadioAlpa.png"
  href: "https://radioalpa.com/"
- image: "Superforma.png"
  href: "https://superforma.fr/"
- image: "SyncopeProd.png"
  href: "https://www.facebook.com/p/Syncope-Prod-100009027701073/"
- image: "UnikMusic.png"
  href: "https://www.facebook.com/unikmusicshop/?locale=fr_FR"

stories:
  enabled: true
  output_dir: "misenpageur/bidul/stories"
  width: 1080
  height: 1920
  agenda_font_name: "Arial Narrow"
  agenda_font_size: 18
  text_color: "#62d92f"
  background_color: "#000000"
  margin: 25
  line_spacing_ratio: 2.0


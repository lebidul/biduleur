# =========================
# Configuration optimisée pour IMPRESSION PROFESSIONNELLE
# =========================
#
# Ce fichier est une version améliorée de config.yml
# avec tous les paramètres d'impression activés.
#
# Usage : python -m misenpageur.main --config misenpageur/config.print.yml

# Label du mois (optionnel, juste pour les logs)
month_label: "2025-11"

# Chemins relatifs Ã  la racine du projet
input_html: "misenpageur/fichier_biduleur/biduleur_bullets.html"
template_pdf: "misenpageur/templates/bidul_template.pdf"
output_pdf: "misenpageur/bidul/bidul_print.pdf"  # ✅ Nom différent pour ne pas écraser

logos_dir: "misenpageur/assets/logos"
cover_image: "misenpageur/assets/couv/couverture.png"
nobr_file: "misenpageur/assets/textes/nobr.txt"
ours_md: "misenpageur/assets/ours/ours.md"
ours_svg: "misenpageur/assets/ours/ours_template.svg"

# =========================
# ParamÃ¨tres typographiques
# =========================

font_name: "Arial Narrow"  # ✅ Ou "DejaVuSans" pour garantir l'embarquement

# Taille de police : min/max autorisÃ©es pour le shrink
font_size_min: 5
font_size_max: 30.0

font_size_mode: auto
# font_size_mode: force
font_size_forced: 7.9

# Ratio entre taille et interligne (leading = font_size * leading_ratio)
leading_ratio: 1.12

# =========================
# Marges internes
# =========================

inner_padding: 2

# =========================
# RÃ©partition du texte HTML
# =========================

text_sections_order:
  - "S5"
  - "S6"
  - "S3"
  - "S4"

# Espacement (pt)
date_spaceBefore: 4
date_spaceAfter: 4

event_spaceBefore: 1
event_spaceAfter: 1

event_spaceAfter_perLine: 0.4
min_event_spaceAfter: 1
first_non_event_spaceBefore_in_S5: 0

# CÃ©sure utile
split_min_gain_ratio: 0.10

# Bullets / hanging indent
show_event_bullet: true
event_bullet_replacement: null
event_hanging_indent: 13
bullet_text_indent: 1

# Date box (bloc)
date_box:
  enabled: false
  padding: 3
  border_width: 0
  border_color: "#000000"
  back_color: "#f2f2f2"

# Configuration de la ligne horizontale pour les dates
date_line:
  enabled: true
  width: 1.5
  color: "#000000"
  gap_after_text_mm: 3.0

auteur_couv: ""
auteur_couv_url: ""

# ======================================================================
# ✅ CONFIGURATION IMPRESSION PROFESSIONNELLE - ACTIVÉE
# ======================================================================

prepress:
  # === IMAGES : Conversion CMYK et Optimisation ===
  convert_images: false              # ✅ ACTIF : Convertit RGB → CMYK
  jpeg_quality: 95                  # ✅ Qualité maximale (95-100 recommandé)
  min_effective_dpi: 300            # ✅ Alerte si DPI < 300
  max_effective_dpi: 450            # ✅ Réduit si trop lourd (>450 DPI)

  # Profil ICC CMYK (optionnel, mais recommandé pour imprimeurs exigeants)
  # Exemples : "CoatedFOGRA39.icc", "ISOcoated_v2_300_eci.icc"
  cmyk_profile: ""                  # Laisser vide = conversion basique

  # === REPÈRES D'IMPRESSION ===
  add_crop_marks: true              # ✅ ACTIF : Traits de coupe aux 4 coins
  bleed_mm: 3                       # ✅ Fond perdu 3mm (standard)

  # === PDF/X : Standard Professionnel (DÉSACTIVÉ par défaut) ===
  # ⚠️ Nécessite Ghostscript installé !
  # Pour activer : changer pdfx: false → pdfx: true
  pdfx: true

  # Chemin vers Ghostscript (adapter selon ton OS)
  ghostscript_path: "gswin64c"      # Windows : gswin64c
  # ghostscript_path: "gs"          # Linux/macOS : gs

  # Profil ICC de sortie pour PDF/X (optionnel)
  pdfx_icc: ""                      # Ex: "ISOcoated_v2_300_eci.icc"

# ======================================================================

s1_split:
  logos_ratio: 0.5
  gutter: 6

pdf_layout:
